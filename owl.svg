<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 530"
     fill="none"
     stroke="#000000"
     stroke-width="14"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- Full owl silhouette: ear tufts + head + body in one continuous outline -->
  <path d="
    M 180 478
    C 110 478, 55 460, 35 410
    C 15 360, 25 280, 60 230
    C 80 200, 95 188, 100 180
    C 92 150, 78 120, 105 95
    C 130 110, 158 145, 168 175
    C 174 182, 186 182, 192 175
    C 202 145, 230 110, 255 95
    C 282 120, 268 150, 260 180
    C 265 188, 280 200, 300 230
    C 335 280, 345 360, 325 410
    C 305 460, 250 478, 180 478 Z
  "/>

  <!-- Eyes -->
  <circle cx="130" cy="240" r="36"/>
  <circle cx="230" cy="240" r="36"/>

  <!-- Pupils: filled half-moons at top of each eye -->
  <path d="M 102 242
           A 28 26 0 0 1 158 242 Z"
        fill="#000000" stroke="none"/>
  <path d="M 202 242
           A 28 26 0 0 1 258 242 Z"
        fill="#000000" stroke="none"/>

  <!-- Beak: small diamond between eyes -->
  <path d="M 180 268 L 162 295 L 180 322 L 198 295 Z"/>

  <!-- Wing: large curve wrapping around the body, with inner feather -->
  <path d="M 90 290
           C 45 360, 65 430, 180 445"/>
  <path d="M 115 345
           C 100 390, 130 425, 180 428"/>

  <!-- Feet: two distinct stubby feet, three toes each -->
  <path d="M 145 478 L 145 498"/>
  <path d="M 122 498 L 168 498"/>
  <path d="M 130 498 L 130 510"/>
  <path d="M 145 498 L 145 510"/>
  <path d="M 160 498 L 160 510"/>

  <path d="M 215 478 L 215 498"/>
  <path d="M 192 498 L 238 498"/>
  <path d="M 200 498 L 200 510"/>
  <path d="M 215 498 L 215 510"/>
  <path d="M 230 498 L 230 510"/>
</svg>
